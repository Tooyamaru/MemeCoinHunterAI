name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - "wip/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python 3.13 tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked Python environment
        run: uv sync --locked --no-progress

      - name: Run Python tests
        run: uv run pytest -q

      - name: Check whitespace errors
        run: git diff --check

  typescript-checks:
    name: TypeScript checks and builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install locked Node.js workspace
        run: pnpm install --frozen-lockfile

      - name: Run workspace typechecks
        run: pnpm run typecheck

      - name: Build workspace packages
        env:
          BASE_PATH: /
          NODE_ENV: production
          PORT: "5000"
        run: pnpm -r --if-present run build
