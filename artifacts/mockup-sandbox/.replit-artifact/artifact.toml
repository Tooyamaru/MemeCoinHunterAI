kind = "design"
previewPath = "/__mockup"
title = "Canvas"
version = "1.0.0"
id = "XegfDyZt7HqfW2Bb8Ghoy"

[[services]]
localPort = 8081
name = "Component Preview Server"
paths = ["/__mockup"]

[services.env]
PORT = "8081"
BASE_PATH = "/__mockup"

[services.development]
run = "pnpm --filter @workspace/mockup-sandbox run dev"


[[services]]
localPort = 8082
name = "Hunter Room Standalone"
paths = ["/hunter-room"]

[services.env]
PORT = "8082"
BASE_PATH = "/hunter-room"
VITE_HUNTER_ROOM_STANDALONE = "1"

[services.development]
run = "pnpm --filter @workspace/mockup-sandbox run dev:hunter-room"


[[services]]
localPort = 8083
name = "Operator Facade"
paths = ["/api/v1", "/health", "/ready"]

[services.env]
APP_ENV = "development"
APP_HOST = "0.0.0.0"
APP_PORT = "8083"

[services.development]
run = "uv run uvicorn backend.api.main:app --host 0.0.0.0 --port 8083"
