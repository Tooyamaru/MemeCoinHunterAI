openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: inspection
    description: Read-only market inspection operations
  - name: candidate-discovery
    description: Bounded provider candidate listings without canonical admission
  - name: token-safety
    description: Explicit bounded token-safety evidence assessment
  - name: opportunity-evaluation
    description: Explicit local admission diagnostics over already-held inspection and safety reports
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /inspections:
    post:
      operationId: inspectToken
      tags: [inspection]
      summary: Inspect all DexScreener pairs for one token
      description: Performs one explicit, read-only inspection without ranking, approval, or trading behavior.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenInspectionInput"
      responses:
        "200":
          description: Inspection report, including all returned pairs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionWithTemporalEvidence"
        "400":
          description: Invalid chain or token input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Inspection concurrency limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Inspector or source failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Inspector execution timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /candidate-listings:
    get:
      operationId: listCandidateTokens
      tags: [candidate-discovery]
      summary: Load a bounded DexScreener token-profile listing
      description: >
        Performs one explicit, read-only request to DexScreener's documented
        latest token-profiles endpoint. The result preserves provider order and
        is an unadmitted provider listing, not comprehensive discovery, ranking,
        approval, or investment quality.
      responses:
        "200":
          description: Bounded provider candidate listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateListingResponse"
        "429":
          description: Candidate listing concurrency limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Provider or response validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Provider request timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /token-safety:
    post:
      operationId: assessTokenSafety
      tags: [token-safety]
      summary: Assess one token with bounded GoPlus safety evidence
      description: >
        Performs one explicit, read-only request to the bounded GoPlus Token
        Security API and composes the response through the existing P03
        evaluator and eligibility contracts. This is non-authoritative evidence,
        not a safety guarantee, trading approval, or P08 acceptance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenSafetyInput"
      responses:
        "200":
          description: Non-authoritative safety evidence assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenSafetyAssessment"
        "400":
          description: Invalid chain or token input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Chain is outside the bounded integration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Safety assessment concurrency limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Provider or response validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Provider request timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /opportunity-evaluations:
    post:
      operationId: evaluateOpportunity
      tags: [opportunity-evaluation]
      summary: Produce an admission diagnostic for one explicitly selected pair
      description: >
        Validates and composes one inspection report and one token-safety
        assessment already held by the client. This action makes no provider
        request. It never ranks pairs, authenticates client-held evidence, or
        treats receipt time as source observation time. Because this request
        contract does not carry canonical P04 signal and feature snapshots, the
        current live result is an admission diagnostic rather than a completed
        P04/P05 evaluation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityEvaluationInput"
      responses:
        "200":
          description: Explicit local admission diagnostic result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityEvaluation"
        "400":
          description: Invalid reports or contradictory identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TokenInspectionInput:
      type: object
      additionalProperties: false
      properties:
        chainId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9._~-]+$"
        tokenAddress:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._~-]+$"
      required: [chainId, tokenAddress]
    CandidateLink:
      type: object
      additionalProperties: false
      properties:
        type:
          type: ["string", "null"]
        label:
          type: ["string", "null"]
        url:
          type: ["string", "null"]
      required: [type, label, url]
    CandidateListingEntry:
      type: object
      additionalProperties: false
      properties:
        provider_index:
          type: integer
          minimum: 0
          maximum: 49
        provider_entry_type:
          type: string
          enum: [object, array, "null", string, number, boolean]
        chainId:
          type: ["string", "null"]
        tokenAddress:
          type: ["string", "null"]
        url:
          type: ["string", "null"]
        icon:
          type: ["string", "null"]
        header:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        links:
          oneOf:
            - type: array
              maxItems: 20
              items:
                $ref: "#/components/schemas/CandidateLink"
            - type: "null"
        status:
          type: string
          enum: [SELECTABLE, DUPLICATE, MISSING_IDENTITY, INVALID]
        inspectable:
          type: boolean
        duplicate_of_index:
          type: ["integer", "null"]
          minimum: 0
          maximum: 49
        issues:
          type: array
          maxItems: 20
          items:
            type: string
      required:
        - provider_index
        - provider_entry_type
        - chainId
        - tokenAddress
        - url
        - icon
        - header
        - description
        - links
        - status
        - inspectable
        - duplicate_of_index
        - issues
    CandidateListingResponse:
      type: object
      additionalProperties: false
      properties:
        source:
          type: string
          enum: [DexScreener]
        endpoint:
          type: string
          format: uri
        selection_basis:
          type: string
        admission_status:
          type: string
          enum: [NOT_ADMITTED]
        completeness:
          type: string
          enum: [BOUNDED_PROVIDER_LISTING]
        limit:
          type: integer
          minimum: 1
          maximum: 50
        received_at:
          type: string
          format: date-time
        http_status:
          type: integer
          minimum: 200
          maximum: 299
        response_bytes:
          type: integer
          minimum: 0
          maximum: 1048576
        truncated:
          type: boolean
        candidates:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/CandidateListingEntry"
        selectable_count:
          type: integer
          minimum: 0
          maximum: 50
        invalid_count:
          type: integer
          minimum: 0
          maximum: 50
        duplicate_count:
          type: integer
          minimum: 0
          maximum: 50
      required:
        - source
        - endpoint
        - selection_basis
        - admission_status
        - completeness
        - limit
        - received_at
        - http_status
        - response_bytes
        - truncated
        - candidates
        - selectable_count
        - invalid_count
        - duplicate_count
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        detail:
          type: ["string", "null"]
      required: [error, code]
    TokenRef:
      type: object
      additionalProperties: true
      properties:
        address:
          type: ["string", "null"]
        name:
          type: ["string", "null"]
        symbol:
          type: ["string", "null"]
    WindowValues:
      type: object
      additionalProperties: true
      properties:
        m5:
          type: ["string", "null"]
        h1:
          type: ["string", "null"]
        h6:
          type: ["string", "null"]
        h24:
          type: ["string", "null"]
    TransactionWindow:
      type: object
      additionalProperties: true
      properties:
        buys:
          type: ["string", "null"]
        sells:
          type: ["string", "null"]
    TransactionWindows:
      type: object
      additionalProperties: true
      properties:
        m5:
          oneOf:
            - $ref: "#/components/schemas/TransactionWindow"
            - type: "null"
        h1:
          oneOf:
            - $ref: "#/components/schemas/TransactionWindow"
            - type: "null"
        h6:
          oneOf:
            - $ref: "#/components/schemas/TransactionWindow"
            - type: "null"
        h24:
          oneOf:
            - $ref: "#/components/schemas/TransactionWindow"
            - type: "null"
    Liquidity:
      allOf:
        - $ref: "#/components/schemas/WindowValues"
        - type: object
          properties:
            usd:
              type: ["string", "null"]
            base:
              type: ["string", "null"]
            quote:
              type: ["string", "null"]
    InspectionFinding:
      type: object
      additionalProperties: true
      properties:
        code:
          type: string
        source_field:
          type: ["string", "null"]
        value: {}
      required: [code]
    PairInspection:
      type: object
      additionalProperties: true
      properties:
        source_pair_created_at:
          type: ["string", "null"]
        field_provenance:
          type: object
          additionalProperties: true
        findings:
          type: array
          items:
            $ref: "#/components/schemas/InspectionFinding"
      required: [field_provenance, findings]
    InspectionPair:
      type: object
      additionalProperties: true
      properties:
        pairAddress:
          type: ["string", "null"]
        chainId:
          type: ["string", "null"]
        dexId:
          type: ["string", "null"]
        url:
          type: ["string", "null"]
        baseToken:
          oneOf:
            - $ref: "#/components/schemas/TokenRef"
            - type: "null"
        quoteToken:
          oneOf:
            - $ref: "#/components/schemas/TokenRef"
            - type: "null"
        priceNative:
          type: ["string", "null"]
        priceUsd:
          type: ["string", "null"]
        fdv:
          type: ["string", "null"]
        marketCap:
          type: ["string", "null"]
        liquidity:
          oneOf:
            - $ref: "#/components/schemas/Liquidity"
            - type: "null"
        volume:
          oneOf:
            - $ref: "#/components/schemas/WindowValues"
            - type: "null"
        priceChange:
          oneOf:
            - $ref: "#/components/schemas/WindowValues"
            - type: "null"
        txns:
          oneOf:
            - $ref: "#/components/schemas/TransactionWindows"
            - type: "null"
        pairCreatedAt:
          type: ["string", "null"]
        inspection:
          $ref: "#/components/schemas/PairInspection"
      required: [inspection]
    AttemptLog:
      type: object
      properties:
        attempt:
          type: integer
          minimum: 1
          maximum: 2
        status_code:
          type: ["integer", "null"]
          minimum: 100
          maximum: 599
        response_bytes:
          type: integer
          minimum: 0
          maximum: 1048576
        received_at:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
      required: [attempt, status_code, response_bytes, received_at]
    InspectionRequest:
      type: object
      properties:
        endpoint:
          type: string
        chain_id:
          type: string
        token_address:
          type: string
        attempts:
          type: integer
          minimum: 1
          maximum: 2
        retry_count:
          type: integer
          minimum: 0
          maximum: 1
        attempt_log:
          type: array
          items:
            $ref: "#/components/schemas/AttemptLog"
      required: [endpoint, chain_id, token_address, attempts, retry_count, attempt_log]
    InspectionReceipt:
      type: object
      properties:
        received_at:
          type: ["string", "null"]
        http_status:
          type: ["integer", "null"]
          minimum: 100
          maximum: 599
        response_bytes:
          type: integer
          minimum: 0
          maximum: 1048576
      required: [received_at, http_status, response_bytes]
    UnavailableField:
      type: object
      properties:
        field:
          type: string
        reason:
          type: string
      required: [field, reason]
    InspectionEvidence:
      type: object
      properties:
        p08_acceptance:
          type: string
        p08_observed_at:
          type: ["string", "null"]
        asset_age:
          type: object
          additionalProperties: true
        unavailable_fields:
          type: array
          items:
            $ref: "#/components/schemas/UnavailableField"
      required: [p08_acceptance, p08_observed_at, asset_age, unavailable_fields]
    InspectionPayload:
      type: object
      properties:
        raw_payload_sha256:
          type: ["string", "null"]
        pair_count:
          type: integer
          minimum: 0
          maximum: 128
        pairs:
          type: array
          items:
            $ref: "#/components/schemas/InspectionPair"
      required: [raw_payload_sha256, pair_count, pairs]
    InspectionReport:
      type: object
      properties:
        tool_version:
          type: string
        source:
          type: string
        request:
          $ref: "#/components/schemas/InspectionRequest"
        receipt:
          $ref: "#/components/schemas/InspectionReceipt"
        payload:
          $ref: "#/components/schemas/InspectionPayload"
        evidence:
          $ref: "#/components/schemas/InspectionEvidence"
        error:
          type: ["object", "null"]
          additionalProperties: true
      required: [tool_version, source, request, receipt, payload, evidence]
    TemporalSourceFreshness:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [UNKNOWN]
        reason:
          type: string
      required: [status, reason]
    TemporalReceiptRecency:
      type: object
      additionalProperties: false
      properties:
        reference_time:
          type: string
        age_seconds:
          type: string
      required: [reference_time, age_seconds]
    TemporalVolumeWindow:
      type: object
      additionalProperties: false
      properties:
        source_label:
          type: ["string", "null"]
        exact_window:
          type: "null"
      required: [source_label, exact_window]
    TemporalAssetAge:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [UNAVAILABLE]
        amount:
          type: "null"
        unit:
          type: "null"
        reference_semantics:
          type: "null"
        source_field:
          type: "null"
        reason:
          type: string
      required:
        [status, amount, unit, reference_semantics, source_field, reason]
    TemporalEvidenceRecord:
      type: object
      additionalProperties: false
      properties:
        contract_version:
          type: string
        source_id:
          type: string
        source_event_id:
          type: "null"
        token_identity:
          type: string
        chain_id:
          type: string
        market_subject_id:
          type: string
        occurrence_id:
          type: string
          pattern: "^[0-9a-f]{64}$"
        source_observed_at:
          type: "null"
        received_at:
          type: string
        source_freshness:
          $ref: "#/components/schemas/TemporalSourceFreshness"
        receipt_recency:
          $ref: "#/components/schemas/TemporalReceiptRecency"
        volume_window:
          $ref: "#/components/schemas/TemporalVolumeWindow"
        asset_age:
          $ref: "#/components/schemas/TemporalAssetAge"
        pair_created_at_source_value:
          type: ["string", "null"]
        raw_payload_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        p08_acceptance:
          type: string
          enum: [NOT_ATTEMPTED]
      required:
        [
          contract_version,
          source_id,
          source_event_id,
          token_identity,
          chain_id,
          market_subject_id,
          occurrence_id,
          source_observed_at,
          received_at,
          source_freshness,
          receipt_recency,
          volume_window,
          asset_age,
          pair_created_at_source_value,
          raw_payload_digest,
          p08_acceptance,
        ]
    TemporalEvidenceReport:
      type: object
      additionalProperties: false
      properties:
        contract_version:
          type: string
        source_id:
          type: string
        token_identity:
          type: string
        chain_id:
          type: string
        raw_payload_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        p08_acceptance:
          type: string
          enum: [NOT_ATTEMPTED]
        records:
          type: array
          maxItems: 128
          items:
            $ref: "#/components/schemas/TemporalEvidenceRecord"
      required:
        [
          contract_version,
          source_id,
          token_identity,
          chain_id,
          raw_payload_digest,
          p08_acceptance,
          records,
        ]
    InspectionWithTemporalEvidence:
      type: object
      additionalProperties: false
      properties:
        report:
          $ref: "#/components/schemas/InspectionReport"
        temporal_evidence:
          $ref: "#/components/schemas/TemporalEvidenceReport"
        evaluation_time:
          type: string
      required: [report, temporal_evidence, evaluation_time]
    TokenSafetyInput:
      type: object
      additionalProperties: false
      properties:
        chainId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9._~-]+$"
        tokenAddress:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._~-]+$"
      required: [chainId, tokenAddress]
    OpportunityEvaluationInput:
      type: object
      additionalProperties: false
      properties:
        chainId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9._~-]+$"
        tokenAddress:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._~-]+$"
        pairIndex:
          type: integer
          minimum: 0
          maximum: 127
        inspection:
          $ref: "#/components/schemas/InspectionWithTemporalEvidence"
        safety:
          $ref: "#/components/schemas/TokenSafetyAssessment"
      required: [chainId, tokenAddress, pairIndex, inspection, safety]
    OpportunityEvaluationIdentity:
      type: object
      additionalProperties: false
      properties:
        chain_id:
          type: string
        token_identity:
          type: string
        pair_address:
          type: string
        pair_index:
          type: integer
        market_subject_id:
          type: string
      required: [chain_id, token_identity, pair_address, pair_index, market_subject_id]
    OpportunityEvaluationBlocker:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        detail:
          type: string
      required: [code, detail]
    OpportunityEvaluationSafety:
      type: object
      additionalProperties: false
      properties:
        claimed_status:
          type: string
          enum: [ELIGIBLE, INELIGIBLE, UNKNOWN]
        recomputed_status:
          type: string
          enum: [ELIGIBLE, INELIGIBLE, UNKNOWN]
        evidence_references:
          type: array
          items:
            type: string
        source_observed_at:
          type: "null"
      required: [claimed_status, recomputed_status, evidence_references, source_observed_at]
    OpportunityEvaluation:
      type: object
      additionalProperties: false
      properties:
        evaluation_version:
          type: string
        status:
          type: string
          enum: [QUALIFIED, BLOCKED]
        identity:
          $ref: "#/components/schemas/OpportunityEvaluationIdentity"
        safety:
          $ref: "#/components/schemas/OpportunityEvaluationSafety"
        blockers:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/OpportunityEvaluationBlocker"
        p04_status:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
        p05_status:
          type: string
          enum: [QUALIFIED, BLOCKED]
        provider_requests:
          type: integer
          enum: [0]
        canonical_discovery:
          type: string
          enum: [NOT_ADMITTED]
        p08_acceptance:
          type: string
          enum: [NOT_ATTEMPTED]
        inspection_received_at:
          type: string
          format: date-time
        safety_received_at:
          type: string
          format: date-time
        source_observed_at:
          type: "null"
      required:
        [
          evaluation_version,
          status,
          identity,
          safety,
          blockers,
          p04_status,
          p05_status,
          provider_requests,
          canonical_discovery,
          p08_acceptance,
          inspection_received_at,
          safety_received_at,
          source_observed_at,
        ]
    SafetyAssessmentIdentity:
      type: object
      additionalProperties: false
      properties:
        chain_id:
          type: string
        token_address:
          type: string
      required: [chain_id, token_address]
    SafetyAssessmentSource:
      type: object
      additionalProperties: false
      properties:
        source_id:
          type: string
          enum: [GoPlus]
        endpoint:
          type: string
          format: uri
        http_status:
          type: integer
          minimum: 200
          maximum: 599
        response_bytes:
          type: integer
          minimum: 0
          maximum: 1048576
        received_at:
          type: string
          format: date-time
        source_observed_at:
          type: "null"
        source_freshness:
          type: string
          enum: [UNKNOWN]
      required:
        [source_id, endpoint, http_status, response_bytes, received_at, source_observed_at, source_freshness]
    SafetyEvidenceItem:
      type: object
      additionalProperties: false
      properties:
        domain:
          type: string
          enum:
            [MINT_FREEZE_AUTHORITY, LP_STATUS_CONCENTRATION, LIQUIDITY_QUALITY, METADATA_MUTABILITY, TOP_HOLDER_CONCENTRATION, FUNDING_WALLET_RELATIONSHIPS, PROXY_CONTROL_PATTERNS, SUSPICIOUS_MUTABLE_BEHAVIOR, TRADABILITY_SELLABILITY, STALE_UNAVAILABLE_EVIDENCE]
        status:
          type: string
          enum: [PASS, FAIL, UNKNOWN]
        quality:
          type: string
          enum: [VALID, INVALID, INCOMPLETE, UNKNOWN]
        freshness_status:
          type: string
          enum: [VALID, INVALID, INCOMPLETE, UNKNOWN]
        observed_at:
          type: string
          format: date-time
        source_id:
          type: string
        method:
          type: string
        evidence_reference:
          type: string
        evidence_context:
          type: object
          additionalProperties: true
        reason_codes:
          type: array
          maxItems: 12
          items:
            type: string
      required:
        [domain, status, quality, freshness_status, observed_at, source_id, method, evidence_reference, evidence_context, reason_codes]
    SafetyMissingEvidence:
      type: object
      additionalProperties: false
      properties:
        domain:
          type: string
        requirement:
          type: string
        reason:
          type: string
      required: [domain, requirement, reason]
    SafetyEvaluation:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ELIGIBLE, INELIGIBLE, UNKNOWN]
        is_authoritative:
          type: boolean
          enum: [false]
        evaluator_id:
          type: string
        contract_version:
          type: string
        evaluation_timestamp:
          type: string
          format: date-time
        input_evidence_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        domain_results:
          type: object
          additionalProperties:
            type: string
            enum: [PASS, FAIL, UNKNOWN]
        evidence_references:
          type: array
          maxItems: 32
          items:
            type: string
        reason_codes:
          type: array
          maxItems: 128
